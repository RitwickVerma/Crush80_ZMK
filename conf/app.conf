# Application configuration for Wobkey Crush 80 (ZMK firmware)
# Applied via: -DEXTRA_CONF_FILE=$(pwd)/conf/app.conf

CONFIG_ZMK_KEYBOARD_NAME="Crush 80"

# USB -----------------------------------------------------------------------
CONFIG_USB_DC_B91=y
CONFIG_ZMK_USB=y

# HID: three instances, and nothing else on USB, so the interface numbers are
#   0 = keyboard (HID_0), 1 = OpenRGB raw HID (HID_1, usage page 0xFF60),
#   2 = VIA raw HID (HID_2, usage page 0xFF60, 32-byte reports).
# OpenRGB's QMK OpenRGB detector only probes interface 1, so no other USB
# interface (e.g. a CDC ACM serial port) may come first. Firmware updates use
# MCUboot's own USB serial port (docs/flashing.md); ZMK Studio runs over
# Bluetooth.
CONFIG_USB_HID_DEVICE_COUNT=3
# Keep the keyboard interrupt EP at 16 B; the raw-HID instance uses 64 B
# (hard-coded via the per-instance interrupt-OUT zephyr patch).
CONFIG_HID_INTERRUPT_EP_MPS=16

# Logging -------------------------------------------------------------------
# DISABLED for battery life. Uncomment for debugging:
# CONFIG_LOG=y
# CONFIG_LOG_BUFFER_SIZE=4096
# CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG=n

# No USB serial port in the app (see the HID note above).
CONFIG_USB_CDC_ACM=n

# MCUboot DFU ---------------------------------------------------------------
# Flashing is done via the MCUboot bootloader's own CDC ACM (docs/flashing.md).
# The app's only SMP transport is Bluetooth (bonded, passkey-authenticated
# peers only); it serves scripts/force_recovery.py.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=8

# BLE -----------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HCI_B91=y
CONFIG_BT_HCI_B91_RX_STACK_SIZE=2048
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=5
CONFIG_ZMK_BLE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# HID indicators
CONFIG_ZMK_HID_INDICATORS=y

# RGB -----------------------------------------------------------------------
# WS2812/SK6812 LED strip via PB7 PSPI + rainy_rgb effects engine
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP_B91_SPI=y
CONFIG_LED_STRIP_B91_SPI_PC2_POWER=y
CONFIG_RAINY_RGB=y
# OpenRGB: direct per-LED control over a raw HID interface (HID_1)
CONFIG_OPENRGB=y
# Auto-confirm the image ~5s after boot (watchdog-guarded). Since flashing now
# goes through the bootloader, every image self-confirms so it can never revert.
CONFIG_CRUSH80_AUTO_CONFIRM=y

# Battery ADC ---------------------------------------------------------------
CONFIG_BATTERY_B91_ADC=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Power Management ----------------------------------------------------------
# Idle: 1 minute (reduces BLE advertising, ~100uA)
# Deep sleep: 5 minutes (near-zero power, ~20uA, cold boot on wake)
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
# B91 has no USB VBUS-detect — without this, sleep never fires on battery power.
CONFIG_ZMK_USB_NO_VBUS_DETECT=y

# VIA ----------------------------------------------------------------------
# Edit the keymap from the VIA configurator (docs/via.md).
CONFIG_VIA=y

# ZMK Studio ----------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_UART=n
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=64

# Raw flash management (custom SMP group 64; restricted over Bluetooth) -----
CONFIG_FLASH_MGMT=y

# Boot diagnostics ----------------------------------------------------------
# Uncomment for debugging:
# CONFIG_BOOT_DIAG=y
CONFIG_BOOT_DIAG=n

# Fn+Esc (&bootloader) enters recovery by erasing the image header (recovery.c);
# the retained boot-mode flag below does not survive this chip's reset ----
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
